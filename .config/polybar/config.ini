[colors]
base = #1b1b1f
mantle = #0a140f
mantle2 = #1b1b1f
crust = #06100a
text = #c8e6d0
subtext0 = #9cbfa8
subtext1 = #b0d0ba
surface0 = #1c3326
surface1 = #274433
surface2 = #335541
overlay0 = #4a6b56
overlay1 = #5c7d68
overlay2 = #6e8f7a
blue = #4fae7c
lavender = #7fcf9e
sapphire = #3f9e82
sky = #59b892
teal = #2fae8b
green = #52c47e
yellow = #a9c15c
peach = #7cae4d
maroon = #6f8f4a
red = #a4553f
mauve = #6bbf8e
mauve1 = #bfab6b
pink = #8fd6ab
flamingo = #79b892
flamingo1 = #bfab6b
rosewater = #a7d9bc
transparent = #00000000

